# Local verification stack — builds images from the sibling repo
# checkouts (../cdis-backend, ../cdis-frontend) rather than pulling from
# a registry. This is deliberately NOT the production model (see
# compose.production.yaml once it exists): it exists so this repo's own
# reverse-proxy routing and multi-container wiring can be verified
# end-to-end without needing a registry or a real server yet.
#
# Run from the repo root: docker compose -f compose/compose.yaml up -d
name: cdis

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cdis
      MYSQL_USER: cdis
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no `ports:` — MySQL is only reachable from other
    # containers on this network, never from the host or the internet.

  backend:
    build:
      # Defaults match the standalone cdis-deployment repo's sibling
      # layout (../../cdis-backend). The CDIS Template monorepo's
      # deployment/compose/.env overrides this to ../../back-end,
      # since there the sibling is this repo's own back-end/ folder,
      # not a separate cdis-backend clone.
      context: ${BACKEND_BUILD_CONTEXT:-../../cdis-backend}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      DATABASE_URL: mysql://cdis:${DB_PASSWORD}@mysql:3306/cdis?allowPublicKeyRetrieval=true
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 7
      BCRYPT_SALT_ROUNDS: 12
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: 5
      ACCOUNT_LOCKOUT_DURATION_MINUTES: 15
    depends_on:
      mysql:
        condition: service_healthy
    # No `ports:` here either — only the reverse proxy talks to this,
    # over the internal Docker network (service name `backend`).

  frontend:
    build:
      context: ${FRONTEND_BUILD_CONTEXT:-../../cdis-frontend}
      args:
        VITE_APP_NAME: CDIS
        VITE_APP_ENV: production
        # Relative path — resolves against whatever origin the browser
        # actually loaded the page from, so the exact public URL never
        # needs to be known at image-build time.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend

  reverse-proxy:
    image: httpd:2.4-alpine
    restart: unless-stopped
    volumes:
      - ../reverse-proxy/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  mysql-data:
