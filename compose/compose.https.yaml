# Steady-state HTTPS — layer this on top of compose.production.yaml
# AFTER scripts/setup-https.sh has obtained the first certificate.
# scripts/setup-https.sh overwrites reverse-proxy/apache/httpd.conf
# in place (envsubst'd from httpd.tls.conf.template) rather than
# swapping which file is mounted — Compose *appends* volume lists
# across -f files rather than replacing them, so trying to override
# the base file's config mount here would leave both the bootstrap and
# TLS config bind-mounted into the container at once.
services:
  reverse-proxy:
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required for HTTPS}
    volumes:
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    ports:
      - "443:443"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["sh", "-c"]

volumes:
  certbot-webroot:
  certbot-certs:
