# Single public origin fronting both containers — the browser only ever
# talks to this proxy, never directly to the backend or frontend
# container. Routing frontend and API under the same origin means the
# app's own cookies/CORS story stays same-origin (VITE_API_BASE_URL=
# /api/v1, a relative path) instead of needing cross-origin CORS at all.
#
# A full standalone httpd.conf (not a fragment under conf/extra/) so the
# whole config is one file, mirroring the previous nginx setup and
# scripts/setup-https.sh's envsubst-and-overwrite approach for HTTPS.
ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so

<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

ErrorLog /proc/self/fd/2
LogLevel warn
<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
</IfModule>

TypesConfig conf/mime.types

# Same intent as nginx's client_max_body_size 5m.
LimitRequestBody 5242880

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "http"

# Let's Encrypt's HTTP-01 domain validation hits this path — served
# from a volume shared with the certbot container (see
# compose.https.yaml). Needed both for the first certificate and every
# renewal afterward, so it stays in the base config rather than only
# the bootstrap phase. The `ProxyPass ... !` exclusion keeps this path
# out of the catch-all proxy rule below.
Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
<Directory "/var/www/certbot">
    Require all granted
</Directory>
ProxyPass /.well-known/acme-challenge/ !

ProxyPass /api/ http://backend:4000/api/
ProxyPassReverse /api/ http://backend:4000/api/

ProxyPass /health http://backend:4000/health
ProxyPassReverse /health http://backend:4000/health

# mod_proxy_http passes Set-Cookie and other response headers through
# untouched by default — no equivalent of nginx's explicit
# proxy_pass_header directive is needed here.
ProxyPass / http://frontend:80/
ProxyPassReverse / http://frontend:80/
