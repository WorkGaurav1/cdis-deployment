# Single public origin fronting both containers — the browser only ever
# talks to this proxy, never directly to the backend or frontend
# container. Routing frontend and API under the same origin means the
# app's own cookies/CORS story stays same-origin (VITE_API_BASE_URL=
# /api/v1, a relative path) instead of needing cross-origin CORS at all.
server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookies (access/refresh/csrf) must pass through untouched.
        proxy_pass_header Set-Cookie;
    }

    location /health {
        proxy_pass http://backend:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
