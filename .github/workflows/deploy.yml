name: Deploy

# Fired by cdis-frontend/cdis-backend's CI after a successful build-and-push
# on main (see their ci.yml — "Trigger deploy" step). Runs on a self-hosted
# runner registered on the production server itself: no SSH private key
# lives in GitHub secrets, and no inbound SSH access from GitHub's runner
# IP ranges is needed for this job specifically.
on:
  repository_dispatch:
    types: [deploy-frontend, deploy-backend]
  workflow_dispatch:
    inputs:
      frontend_version:
        description: "Frontend image tag/SHA to deploy (leave blank to keep current)"
        required: false
      backend_version:
        description: "Backend image tag/SHA to deploy (leave blank to keep current)"
        required: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # clean: false — compose/current-versions.env and
      # compose/.env.production are gitignored server state that must
      # survive across runs on this persistent, self-hosted runner. A
      # normal checkout's git-clean step would otherwise wipe them.
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Resolve versions
        id: versions
        run: |
          cd compose
          FRONTEND_VERSION=""
          BACKEND_VERSION=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FRONTEND_VERSION="${{ github.event.inputs.frontend_version }}"
            BACKEND_VERSION="${{ github.event.inputs.backend_version }}"
          elif [ "${{ github.event.action }}" = "deploy-frontend" ]; then
            FRONTEND_VERSION="${{ github.event.client_payload.version }}"
          elif [ "${{ github.event.action }}" = "deploy-backend" ]; then
            BACKEND_VERSION="${{ github.event.client_payload.version }}"
          fi

          # Whichever side wasn't just built keeps its currently-deployed
          # version — that's what makes a single app's CI able to trigger
          # a deploy without knowing the sibling app's version itself.
          if [ -z "$FRONTEND_VERSION" ] && [ -f current-versions.env ]; then
            FRONTEND_VERSION="$(grep '^FRONTEND_VERSION=' current-versions.env | cut -d= -f2)"
          fi
          if [ -z "$BACKEND_VERSION" ] && [ -f current-versions.env ]; then
            BACKEND_VERSION="$(grep '^BACKEND_VERSION=' current-versions.env | cut -d= -f2)"
          fi

          if [ -z "$FRONTEND_VERSION" ] || [ -z "$BACKEND_VERSION" ]; then
            echo "Missing a version and no current-versions.env to fall back to." >&2
            echo "Run ./scripts/deploy.sh <frontend-version> <backend-version> by hand once first." >&2
            exit 1
          fi

          echo "frontend=$FRONTEND_VERSION" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: ./scripts/deploy.sh "${{ steps.versions.outputs.frontend }}" "${{ steps.versions.outputs.backend }}"
